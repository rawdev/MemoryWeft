# MWeft Manager — per-project configuration.
# Generated by `mweft-ui` when initializing a project folder.

group: "default"
domain: "default"

# Domains to search when calling mweft_search without an explicit target.
search_targets:
  - { domain: "ai_memory" }

# Forced save-tags — cross-cutting metadata (org name, user, etc.) that does
# NOT appear in event content. Every mweft_remember save is attached to these
# existing predefined groups by name (event_member_of), NOT nested under
# `group` (the single save root), in addition to the per-call tag/category.
# Surfaced as `applied_save_tags`. Multi-valued. Pick in the Manager UI. (BP-95 §5.4)
save_tags: []

# Backend selection (docs/107_code_fix-Backend_env_unification.md):
# - postgres_dsn set     → PostgreSQL mode (graph + vector + content all in PG)
# - postgres_dsn empty   → SQLite mode (uses files inside DATA_DIR)
data_dir: "./data"
postgres_dsn: ""

# Embedding model. Local provider downloads from HuggingFace on first warmup.
# ``dim`` is optional — when omitted, it's resolved from ``model`` via
# DEFAULT_DIM_BY_MODEL.  Pin it explicitly to override (e.g. custom model).
embedding:
  provider: "local"         # "local" | "openai" | "dummy"
  model: "BAAI/bge-m3"
  dim: 1024                 # BGE-M3 native dim; matches existing vector schemas
